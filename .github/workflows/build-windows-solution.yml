---
name: Build - Windows - Solution

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Tibia/silnik/canary_test/src/**"
      - "Tibia/silnik/canary_test/vcpkg.json"
  merge_group:
  push:
    paths:
      - "Tibia/silnik/canary_test/src/**"
      - "Tibia/silnik/canary_test/vcpkg.json"
    branches:
      - main

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  MAKEFLAGS: "-j 2"
  GITHUB_WORKSPACE: ${{ github.workspace }}
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_TRIPLET: x64-windows
  SOURCE_DIR: Tibia/silnik/canary_test

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

  job:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    name: ${{ matrix.os }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        buildtype: [Debug]
        include:
          - os: windows-2022
            triplet: x64-windows
            packages: >
              sccache
    steps:
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.1

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install vcpkg
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $vcpkgJson = Get-Content .\vcpkg.json -Raw | ConvertFrom-Json
          $vcpkgCommitId = $vcpkgJson.'builtin-baseline'.Trim()
          Write-Host "vcpkg commit ID: $vcpkgCommitId"
          git clone https://github.com/Microsoft/vcpkg.git $env:GITHUB_WORKSPACE\vcpkg
          cd $env:GITHUB_WORKSPACE\vcpkg
          git checkout $vcpkgCommitId
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install

      - name: Print useful paths
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Vcpkg Path: $env:GITHUB_WORKSPACE\vcpkg"
          Write-Host "Source Dir: $env:GITHUB_WORKSPACE\${{ env.SOURCE_DIR }}"
          Write-Host "Triplet: ${{ matrix.triplet }}"

      - name: Generate Visual Studio Solution with CMake
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          New-Item -ItemType Directory -Force -Path build
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build project
        working-directory: ${{ env.SOURCE_DIR }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: msbuild.exe /p:VcpkgEnableManifest=true /p:Configuration=${{ matrix.buildtype }} /p:Platform=x64 build\canary.sln

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.os }}-${{ matrix.buildtype }}
          path: |
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/build/**/*.dll
            ${{ github.workspace }}/${{ env.SOURCE_DIR }}/build/**/*.exe
