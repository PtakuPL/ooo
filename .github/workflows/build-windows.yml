name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - "**/*.md"
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Setup MSVC (VS 2022, x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Resolve vcpkg commit (builtin-baseline or fallback)
        id: vcpkg-commit
        shell: bash
        run: |
          fallback=5b1214315250939257ef5d62ecdcbca18cf4fb1c
          vcpkg_file="Tibia/silnik/canary_test/testyy/vcpkg.json"
          if [ -f "$vcpkg_file" ]; then
            commit=$(python -c "import json; print(json.load(open('$vcpkg_file')).get('builtin-baseline',''))" 2>/dev/null || echo "")
          else
            commit=""
          fi
          if [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "vcpkgGitCommitId=$commit" >> "$GITHUB_OUTPUT"
            echo "Using builtin-baseline $commit"
          else
            echo "vcpkgGitCommitId=$fallback" >> "$GITHUB_OUTPUT"
            echo "Using fallback commit $fallback"
          fi

      - name: Setup vcpkg (manifest install)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-commit.outputs.vcpkgGitCommitId }}
          runVcpkgInstall: true
          vcpkgJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg.json
          vcpkgConfigurationJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg-configuration.json
          vcpkgJsonIgnores: "['**/vcpkg/**','**/browser/overlay-ports/**']"
          doNotCache: false

      - name: Configure (CMake + vcpkg toolchain, VS generator)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}
          path: |
            Tibia/silnik/canary_test/testyy/build/**/Release/*.exe
            Tibia/silnik/canary_test/testyy/build/**/*.dll
            Tibia/silnik/canary_test/testyy/build/*.pdb
          if-no-files-found: warn

      - name: Upload CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-windows
          path: |
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeOutput.log
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeError.log
          if-no-files-found: warn

  build-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: Tibia/silnik/canary_test/testyy

    env:
      CMAKE_PREFIX_PATH: /mingw64
      PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Remove nested git directories (upstream mirrors)
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-abseil
            mingw-w64-x86_64-asio
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fmt
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-pugixml
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-luajit
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-pkgconf

      - name: Configure (CMake + Ninja, MINGW64)
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_C_COMPILER=/mingw64/bin/gcc \
            -DCMAKE_CXX_COMPILER=/mingw64/bin/g++

      - name: Build (Release)
        run: cmake --build build --parallel

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw64-release-${{ github.run_number }}
          path: |
            Tibia/silnik/canary_test/testyy/build/**/*.exe
            Tibia/silnik/canary_test/testyy/build/**/*.dll
            Tibia/silnik/canary_test/testyy/build/**/*.pdb
          if-no-files-found: warn

      - name: Upload CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-windows-mingw64
          path: |
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeOutput.log
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
