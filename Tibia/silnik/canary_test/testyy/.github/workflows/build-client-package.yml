# =============================================================
# Build Client Package — czysta instalka OTClient dla graczy
# =============================================================
# Buduje OTClient, wstrzykuje customizacje (init.lua, moduły),
# stripuje pliki deweloperskie i pakuje ZIP gotowy do dystrybucji.
#
# Trigger: manual (workflow_dispatch) lub push taga v*-client
# Output: ZIP per OS, upload jako GHA artifact

name: build-client-package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Client version (e.g. 1.0.3)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev
  push:
    tags:
      - 'v*-client'

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CLIENT_SRC: Tibia/silnik/canary_test/testyy

jobs:
  # ─────────────────────────────────────────────
  # Windows x64 build
  # ─────────────────────────────────────────────
  windows:
    name: Package (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'cf6692675e04c036e21f26d64ae5fa3c8485f224'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/${{ env.CLIENT_SRC }}/custom-triplets" `
            -DOTCLIENT_PLAYER_BUILD=ON `
            -DBUILD_STATIC_LIBRARY=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"

      - name: Verify sealed player CMake option
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: grep -q '^OTCLIENT_PLAYER_BUILD:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        working-directory: ${{ env.CLIENT_SRC }}
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            VER="${VER%-client}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble client package
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"
          rm -rf "$PKG"
          mkdir -p "$PKG"

          # ── 1. Compiled binary ──
          cp build/otclient.exe "$PKG/" 2>/dev/null || cp build/Release/otclient.exe "$PKG/" 2>/dev/null || cp build/RelWithDebInfo/otclient.exe "$PKG/" || { echo "ERROR: otclient.exe not found"; exit 1; }

          # ── 2. Runtime DLLs (from build output or vcpkg installed) ──
          # Copy DLLs co-located with exe first, then root DLLs as fallback
          find build -maxdepth 3 -name "*.dll" -exec cp {} "$PKG/" \; 2>/dev/null || true
          for dll in *.dll; do
            [ -f "$dll" ] && [ ! -f "$PKG/$dll" ] && cp "$dll" "$PKG/"
          done

          # ── 3. Data directories ──
          cp -r data "$PKG/data"
          cp -r modules "$PKG/modules"
          [ -d mods ] && cp -r mods "$PKG/mods"

          # ── 4. Config files ──
          cp init.lua "$PKG/"
          [ -f meta.lua ] && cp meta.lua "$PKG/"
          [ -f cacert.pem ] && cp cacert.pem "$PKG/"

          # ── 5. Inject customizations ──
          # NOTE: CLIENT_LOCKED is now handled via getNativeClientLocked() in C++ —
          # no sed needed. The customizations overlay provides the canonical init.lua.

          # 5b. Overlay custom modules from customizations/ directory
          # This directory contains our server-specific overrides:
          #   customizations/modules/  — patched game modules (serverlist lock, feature flags)
          #   customizations/data/     — custom sprites, translations
          #   customizations/init.lua  — full override (optional)
          CUSTOM_DIR="customizations"
          if [ -d "$CUSTOM_DIR" ]; then
            echo "Injecting customizations from $CUSTOM_DIR"
            if [ -f "$CUSTOM_DIR/init.lua" ]; then
              cp "$CUSTOM_DIR/init.lua" "$PKG/init.lua"
              echo "  → init.lua overridden"
            fi
            if [ -d "$CUSTOM_DIR/modules" ]; then
              cp -r "$CUSTOM_DIR/modules/"* "$PKG/modules/" 2>/dev/null || true
              echo "  → modules/ merged ($(find "$CUSTOM_DIR/modules" -type f | wc -l) files)"
            fi
            if [ -d "$CUSTOM_DIR/data" ]; then
              cp -r "$CUSTOM_DIR/data/"* "$PKG/data/" 2>/dev/null || true
              echo "  → data/ merged"
            fi
          else
            echo "No customizations/ directory — using defaults"
          fi

          # ── 6. Strip dev files that may have leaked ──
          rm -rf "$PKG/data"/.git* 2>/dev/null || true
          find "$PKG" -name "CMakeLists.txt" -delete 2>/dev/null || true
          find "$PKG" \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -delete 2>/dev/null || true

          # ── 6b. Remove dev/operator files not needed by player ──
          rm -f "$PKG/start_dev.bat" "$PKG/start_dev.sh" 2>/dev/null || true
          rm -f "$PKG/start_player.bat" "$PKG/start_player.sh" 2>/dev/null || true
          rm -f "$PKG/serverlist.lua" "$PKG/serverlist.json" "$PKG/init_serverlist.lua" 2>/dev/null || true
          rm -f "$PKG/otclientrc.lua" "$PKG/otclientrc.lua.default" 2>/dev/null || true
          rm -rf "$PKG/data/styles.bak" 2>/dev/null || true
          # Remove any leftover shell/batch scripts
          find "$PKG" -maxdepth 1 \( -name "*.sh" -o -name "*.bat" -o -name "*.cmd" \) -delete 2>/dev/null || true
          bash tools/strip_dev_files.sh "$PKG"
          echo "  → dev files stripped"

          # ── 6c. Trim locales — keep only base languages, rest downloaded on-demand ──
          LOCALE_DIR="$PKG/data/locales"
          if [ -d "$LOCALE_DIR" ]; then
            KEEP_LOCALES="en.lua|pl.lua|de.lua|pt.lua|game_i18n_en.lua|game_i18n_pl.lua|game_i18n_de.lua|game_i18n_pt.lua|game_i18n_en_compact.lua|game_i18n_pl_compact.lua|game_i18n_de_compact.lua|game_i18n_pt_compact.lua"
            BEFORE=$(find "$LOCALE_DIR" -type f | wc -l)
            find "$LOCALE_DIR" -maxdepth 1 -type f | while read -r f; do
              BASE=$(basename "$f")
              if ! echo "$BASE" | grep -qE "^($KEEP_LOCALES)$"; then
                rm -f "$f"
              fi
            done
            AFTER=$(find "$LOCALE_DIR" -type f | wc -l)
            echo "  → locales trimmed: $BEFORE → $AFTER files"
          fi

          # ── 7. Create empty dirs for user data ──
          mkdir -p "$PKG/records"

          echo "=== Package contents ==="
          find "$PKG" -type f | wc -l
          echo "files"
          du -sh "$PKG"

      - name: Verify package integrity
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"

          # Must have executable
          [ -f "$PKG/otclient.exe" ] || { echo "FAIL: missing otclient.exe"; exit 1; }

          # Must have init.lua wired to native runtime policy
          grep -q "CLIENT_LOCKED = getNativeClientLocked()" "$PKG/init.lua" || { echo "FAIL: init.lua is not wired to native client lock policy"; exit 1; }

          # Must NOT have source files
          SRC_COUNT=$(find "$PKG" \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) | wc -l)
          [ "$SRC_COUNT" -eq 0 ] || { echo "FAIL: found $SRC_COUNT source files"; exit 1; }

          # Must NOT have CMake files
          CMAKE_COUNT=$(find "$PKG" -name "CMakeLists.txt" | wc -l)
          [ "$CMAKE_COUNT" -eq 0 ] || { echo "FAIL: found CMakeLists.txt"; exit 1; }

          # Must have modules/
          [ -d "$PKG/modules" ] || { echo "FAIL: missing modules/"; exit 1; }

          # Must have data/
          [ -d "$PKG/data" ] || { echo "FAIL: missing data/"; exit 1; }

          # Must NOT have dev files
          DEV_FILES=$(find "$PKG" -maxdepth 1 \( -name "start_dev*" -o -name "start_player*" -o -name "otclientrc*" -o -name "serverlist.*" -o -name "init_serverlist*" -o -name "*.sh" -o -name "*.bat" \) | wc -l)
          [ "$DEV_FILES" -eq 0 ] || { echo "FAIL: found $DEV_FILES dev files in player package"; find "$PKG" -maxdepth 1 \( -name "start_dev*" -o -name "start_player*" -o -name "otclientrc*" -o -name "serverlist.*" -o -name "init_serverlist*" -o -name "*.sh" -o -name "*.bat" \); exit 1; }

          # DLL count check — target is zero-DLL (GHA-007)
          DLL_COUNT=$(find "$PKG" -maxdepth 1 -name "*.dll" | wc -l)
          echo "DLL count: $DLL_COUNT"
          if [ "$DLL_COUNT" -ne 0 ]; then
            echo "::warning::Found $DLL_COUNT DLLs in package — zero-DLL target not yet met (see GHA-007)"
            find "$PKG" -maxdepth 1 -name "*.dll" -exec ls -lh {} \;
          fi

          bash tools/verify-player-package.sh "$PKG" windows

          echo "All integrity checks passed (Windows)"

      - name: Package lint (allowlist/denylist + secret scan)
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -euo pipefail
          PKG="package"
          REPORT="package-lint-report-windows.txt"
          : > "$REPORT"

          echo "[LINT] Top-level allowlist check" | tee -a "$REPORT"
          find "$PKG" -mindepth 1 -maxdepth 1 -printf '%f\n' | while read -r item; do
            case "$item" in
              otclient.exe|init.lua|meta.lua|cacert.pem|data|modules|mods|records|*.dll)
                ;;
              *)
                echo "FAIL: unexpected top-level item: $item" | tee -a "$REPORT"
                exit 1
                ;;
            esac
          done

          echo "[LINT] Denylist extensions check" | tee -a "$REPORT"
          DENY_EXT_COUNT=$(find "$PKG" -type f \
            \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' -o -name '*.lib' -o -name '*.a' -o -name '*.obj' -o -name '*.o' \
            -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \
            -o -name '.env' -o -name '.env.*' -o -name '*.pem.key' -o -name '*.key' -o -name '*.secret' \
            -o -name '*.ps1' -o -name '*.bat' -o -name '*.cmd' -o -name 'CMakeLists.txt' \) | wc -l)
          if [ "$DENY_EXT_COUNT" -ne 0 ]; then
            echo "FAIL: denylist files found ($DENY_EXT_COUNT)" | tee -a "$REPORT"
            find "$PKG" -type f \
              \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' -o -name '*.lib' -o -name '*.a' -o -name '*.obj' -o -name '*.o' \
              -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \
              -o -name '.env' -o -name '.env.*' -o -name '*.pem.key' -o -name '*.key' -o -name '*.secret' \
              -o -name '*.ps1' -o -name '*.bat' -o -name '*.cmd' -o -name 'CMakeLists.txt' \) | sort | tee -a "$REPORT"
            exit 1
          fi

          echo "[LINT] Player cleanup leak check" | tee -a "$REPORT"
          PLAYER_LEAKS=$(find "$PKG" \( \
            -path "$PKG/data/locales/disabled" -o -path "$PKG/data/locales/disabled/*" \
            -o -path "$PKG/modules/.project" -o -path "$PKG/modules/.project/*" \
            -o -name '*.bak' -o -name '*.bak.*' -o -name '*.backup' -o -name '*.corrupted_backup' \
            -o -name '*.utf8.bak*' -o -name '*_upstream.lua' -o -name '*.orig' \
          \) -print)
          if [ -n "$PLAYER_LEAKS" ]; then
            echo "FAIL: player package contains staging/backup files" | tee -a "$REPORT"
            echo "$PLAYER_LEAKS" | sort | tee -a "$REPORT"
            exit 1
          fi

          echo "[LINT] Secret pattern scan" | tee -a "$REPORT"
          if grep -RInE --binary-files=without-match \
            '(TICKET_SECRET|DB_PASS|MYSQL_PASSWORD|PRIVATE KEY|BEGIN [A-Z ]*PRIVATE KEY|PAYPAL_CLIENT_SECRET|GOOGLE_CLIENT_SECRET|FACEBOOK_CLIENT_SECRET|STEAM_API_KEY|HMAC_SECRET|SIGNING_KEY|AWS_SECRET|API_KEY[[:space:]]*=)' \
            "$PKG" >> "$REPORT"; then
            echo "FAIL: secret-like content found in package" | tee -a "$REPORT"
            exit 1
          fi

          echo "PASS: package lint checks completed" | tee -a "$REPORT"

      - name: Generate file manifest (SHA-256 per file)
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          MANIFEST="package-manifest-${VERSION}.json"

          echo "{" > "$MANIFEST"
          echo "  \"version\": \"${VERSION}\"," >> "$MANIFEST"
          echo "  \"channel\": \"${CHANNEL}\"," >> "$MANIFEST"
          echo "  \"os\": \"windows\"," >> "$MANIFEST"
          echo "  \"generatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$MANIFEST"
          echo "  \"files\": [" >> "$MANIFEST"

          SEP=""
          while IFS= read -r filepath; do
            REL="${filepath#$PKG/}"
            HASH=$(sha256sum "$filepath" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$filepath")
            if [ -n "$SEP" ]; then
              echo "," >> "$MANIFEST"
            fi
            SEP=","
            printf '    {"path": "%s", "sha256": "%s", "size": %s}' "$REL" "$HASH" "$SIZE" >> "$MANIFEST"
          done < <(find "$PKG" -type f | sort)

          echo "" >> "$MANIFEST"
          echo "  ]" >> "$MANIFEST"
          echo "}" >> "$MANIFEST"

          echo "Generated $MANIFEST with $(grep -c sha256 "$MANIFEST") files"

      - name: Create ZIP
        shell: bash
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd package
          7z a -tzip "../otclient-windows-x64-${VERSION}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows-x64-${{ steps.version.outputs.version }}
          path: |
            ${{ env.CLIENT_SRC }}/otclient-windows-x64-${{ steps.version.outputs.version }}.zip
            ${{ env.CLIENT_SRC }}/package-manifest-${{ steps.version.outputs.version }}.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # Linux x64 build
  # ─────────────────────────────────────────────
  linux:
    name: Package (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            ninja-build \
            cmake \
            pkg-config \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libasound2-dev \
            libudev-dev

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'cf6692675e04c036e21f26d64ae5fa3c8485f224'

      - name: Configure CMake
        working-directory: ${{ env.CLIENT_SRC }}
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DOTCLIENT_PLAYER_BUILD=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Verify sealed player CMake option
        working-directory: ${{ env.CLIENT_SRC }}
        run: grep -q '^OTCLIENT_PLAYER_BUILD:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        working-directory: ${{ env.CLIENT_SRC }}
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ github.event.inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            VER="${VER%-client}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble client package
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"
          rm -rf "$PKG"
          mkdir -p "$PKG"

          # ── 1. Compiled binary ──
          cp build/otclient "$PKG/" || { echo "ERROR: otclient binary not found"; exit 1; }
          chmod +x "$PKG/otclient"

          # ── 2. Shared libraries (if any from build) ──
          find build -maxdepth 3 -name "*.so" -o -name "*.so.*" | while read so; do
            cp "$so" "$PKG/" 2>/dev/null || true
          done

          # ── 3. Data directories ──
          cp -r data "$PKG/data"
          cp -r modules "$PKG/modules"
          [ -d mods ] && cp -r mods "$PKG/mods"

          # ── 4. Config files ──
          cp init.lua "$PKG/"
          [ -f meta.lua ] && cp meta.lua "$PKG/"
          [ -f cacert.pem ] && cp cacert.pem "$PKG/"

          # ── 5. Inject customizations ──
          # NOTE: CLIENT_LOCKED handled via getNativeClientLocked() — no sed needed.

          # 5b. Overlay custom modules from customizations/ directory
          CUSTOM_DIR="customizations"
          if [ -d "$CUSTOM_DIR" ]; then
            echo "Injecting customizations from $CUSTOM_DIR"
            if [ -f "$CUSTOM_DIR/init.lua" ]; then
              cp "$CUSTOM_DIR/init.lua" "$PKG/init.lua"
              echo "  → init.lua overridden"
            fi
            if [ -d "$CUSTOM_DIR/modules" ]; then
              cp -r "$CUSTOM_DIR/modules/"* "$PKG/modules/" 2>/dev/null || true
              echo "  → modules/ merged ($(find "$CUSTOM_DIR/modules" -type f | wc -l) files)"
            fi
            if [ -d "$CUSTOM_DIR/data" ]; then
              cp -r "$CUSTOM_DIR/data/"* "$PKG/data/" 2>/dev/null || true
              echo "  → data/ merged"
            fi
          else
            echo "No customizations/ directory — using defaults"
          fi

          # ── 6. Strip dev files ──
          rm -rf "$PKG/data"/.git* 2>/dev/null || true
          find "$PKG" -name "CMakeLists.txt" -delete 2>/dev/null || true
          find "$PKG" \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -delete 2>/dev/null || true

          # ── 6b. Remove dev/operator files not needed by player ──
          rm -f "$PKG/start_dev.bat" "$PKG/start_dev.sh" 2>/dev/null || true
          rm -f "$PKG/start_player.bat" "$PKG/start_player.sh" 2>/dev/null || true
          rm -f "$PKG/serverlist.lua" "$PKG/serverlist.json" "$PKG/init_serverlist.lua" 2>/dev/null || true
          rm -f "$PKG/otclientrc.lua" "$PKG/otclientrc.lua.default" 2>/dev/null || true
          rm -rf "$PKG/data/styles.bak" 2>/dev/null || true
          find "$PKG" -maxdepth 1 \( -name "*.sh" -o -name "*.bat" -o -name "*.cmd" \) -delete 2>/dev/null || true
          bash tools/strip_dev_files.sh "$PKG"
          echo "  → dev files stripped"

          # ── 6c. Trim locales — keep only base languages ──
          LOCALE_DIR="$PKG/data/locales"
          if [ -d "$LOCALE_DIR" ]; then
            KEEP_LOCALES="en.lua|pl.lua|de.lua|pt.lua|game_i18n_en.lua|game_i18n_pl.lua|game_i18n_de.lua|game_i18n_pt.lua|game_i18n_en_compact.lua|game_i18n_pl_compact.lua|game_i18n_de_compact.lua|game_i18n_pt_compact.lua"
            BEFORE=$(find "$LOCALE_DIR" -type f | wc -l)
            find "$LOCALE_DIR" -maxdepth 1 -type f | while read -r f; do
              BASE=$(basename "$f")
              if ! echo "$BASE" | grep -qE "^($KEEP_LOCALES)$"; then
                rm -f "$f"
              fi
            done
            AFTER=$(find "$LOCALE_DIR" -type f | wc -l)
            echo "  → locales trimmed: $BEFORE → $AFTER files"
          fi

          # ── 7. Create empty dirs for user data ──
          mkdir -p "$PKG/records"

          echo "=== Package contents ==="
          find "$PKG" -type f | wc -l
          echo "files"
          du -sh "$PKG"

      - name: Verify package integrity
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"

          [ -f "$PKG/otclient" ] || { echo "FAIL: missing otclient"; exit 1; }
          grep -q "CLIENT_LOCKED = getNativeClientLocked()" "$PKG/init.lua" || { echo "FAIL: init.lua is not wired to native client lock policy"; exit 1; }

          SRC_COUNT=$(find "$PKG" \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) | wc -l)
          [ "$SRC_COUNT" -eq 0 ] || { echo "FAIL: found $SRC_COUNT source files"; exit 1; }

          CMAKE_COUNT=$(find "$PKG" -name "CMakeLists.txt" | wc -l)
          [ "$CMAKE_COUNT" -eq 0 ] || { echo "FAIL: found CMakeLists.txt"; exit 1; }

          [ -d "$PKG/modules" ] || { echo "FAIL: missing modules/"; exit 1; }
          [ -d "$PKG/data" ] || { echo "FAIL: missing data/"; exit 1; }

          # Must NOT have dev files
          DEV_FILES=$(find "$PKG" -maxdepth 1 \( -name "start_dev*" -o -name "start_player*" -o -name "otclientrc*" -o -name "serverlist.*" -o -name "init_serverlist*" -o -name "*.sh" -o -name "*.bat" \) | wc -l)
          [ "$DEV_FILES" -eq 0 ] || { echo "FAIL: found $DEV_FILES dev files in player package"; exit 1; }

          bash tools/verify-player-package.sh "$PKG" linux

          echo "All integrity checks passed (Linux)"

      - name: Package lint (allowlist/denylist + secret scan)
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -euo pipefail
          PKG="package"
          REPORT="package-lint-report-linux.txt"
          : > "$REPORT"

          echo "[LINT] Top-level allowlist check" | tee -a "$REPORT"
          find "$PKG" -mindepth 1 -maxdepth 1 -printf '%f\n' | while read -r item; do
            case "$item" in
              otclient|init.lua|meta.lua|cacert.pem|data|modules|mods|records|*.so|*.so.*)
                ;;
              *)
                echo "FAIL: unexpected top-level item: $item" | tee -a "$REPORT"
                exit 1
                ;;
            esac
          done

          echo "[LINT] Denylist extensions check" | tee -a "$REPORT"
          DENY_EXT_COUNT=$(find "$PKG" -type f \
            \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' -o -name '*.lib' -o -name '*.a' -o -name '*.obj' -o -name '*.o' \
            -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \
            -o -name '.env' -o -name '.env.*' -o -name '*.pem.key' -o -name '*.key' -o -name '*.secret' \
            -o -name '*.ps1' -o -name '*.bat' -o -name '*.cmd' -o -name 'CMakeLists.txt' \) | wc -l)
          if [ "$DENY_EXT_COUNT" -ne 0 ]; then
            echo "FAIL: denylist files found ($DENY_EXT_COUNT)" | tee -a "$REPORT"
            find "$PKG" -type f \
              \( -name '*.pdb' -o -name '*.ilk' -o -name '*.exp' -o -name '*.lib' -o -name '*.a' -o -name '*.obj' -o -name '*.o' \
              -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \
              -o -name '.env' -o -name '.env.*' -o -name '*.pem.key' -o -name '*.key' -o -name '*.secret' \
              -o -name '*.ps1' -o -name '*.bat' -o -name '*.cmd' -o -name 'CMakeLists.txt' \) | sort | tee -a "$REPORT"
            exit 1
          fi

          echo "[LINT] Player cleanup leak check" | tee -a "$REPORT"
          PLAYER_LEAKS=$(find "$PKG" \( \
            -path "$PKG/data/locales/disabled" -o -path "$PKG/data/locales/disabled/*" \
            -o -path "$PKG/modules/.project" -o -path "$PKG/modules/.project/*" \
            -o -name '*.bak' -o -name '*.bak.*' -o -name '*.backup' -o -name '*.corrupted_backup' \
            -o -name '*.utf8.bak*' -o -name '*_upstream.lua' -o -name '*.orig' \
          \) -print)
          if [ -n "$PLAYER_LEAKS" ]; then
            echo "FAIL: player package contains staging/backup files" | tee -a "$REPORT"
            echo "$PLAYER_LEAKS" | sort | tee -a "$REPORT"
            exit 1
          fi

          echo "[LINT] Secret pattern scan" | tee -a "$REPORT"
          if grep -RInE --binary-files=without-match \
            '(TICKET_SECRET|DB_PASS|MYSQL_PASSWORD|PRIVATE KEY|BEGIN [A-Z ]*PRIVATE KEY|PAYPAL_CLIENT_SECRET|GOOGLE_CLIENT_SECRET|FACEBOOK_CLIENT_SECRET|STEAM_API_KEY|HMAC_SECRET|SIGNING_KEY|AWS_SECRET|API_KEY[[:space:]]*=)' \
            "$PKG" >> "$REPORT"; then
            echo "FAIL: secret-like content found in package" | tee -a "$REPORT"
            exit 1
          fi

          echo "PASS: package lint checks completed" | tee -a "$REPORT"

      - name: Generate file manifest (SHA-256 per file)
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          set -e
          PKG="package"
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          MANIFEST="package-manifest-${VERSION}.json"

          echo "{" > "$MANIFEST"
          echo "  \"version\": \"${VERSION}\"," >> "$MANIFEST"
          echo "  \"channel\": \"${CHANNEL}\"," >> "$MANIFEST"
          echo "  \"os\": \"linux\"," >> "$MANIFEST"
          echo "  \"generatedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$MANIFEST"
          echo "  \"files\": [" >> "$MANIFEST"

          SEP=""
          while IFS= read -r filepath; do
            REL="${filepath#$PKG/}"
            HASH=$(sha256sum "$filepath" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$filepath")
            if [ -n "$SEP" ]; then
              echo "," >> "$MANIFEST"
            fi
            SEP=","
            printf '    {"path": "%s", "sha256": "%s", "size": %s}' "$REL" "$HASH" "$SIZE" >> "$MANIFEST"
          done < <(find "$PKG" -type f | sort)

          echo "" >> "$MANIFEST"
          echo "  ]" >> "$MANIFEST"
          echo "}" >> "$MANIFEST"

          echo "Generated $MANIFEST with $(grep -c sha256 "$MANIFEST") files"

      - name: Create tarball
        working-directory: ${{ env.CLIENT_SRC }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "otclient-linux-x64-${VERSION}.tar.gz" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-linux-x64-${{ steps.version.outputs.version }}
          path: |
            ${{ env.CLIENT_SRC }}/otclient-linux-x64-${{ steps.version.outputs.version }}.tar.gz
            ${{ env.CLIENT_SRC }}/package-manifest-${{ steps.version.outputs.version }}.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # Sign & Checksums (runs after both builds)
  # ─────────────────────────────────────────────
  sign:
    name: Sign artifacts & checksums
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    if: ${{ vars.ENABLE_SIGNING == 'true' }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums.txt
        run: |
          set -e
          cd artifacts
          echo "# SerwerCanary Client checksums (SHA-256)" > checksums.txt
          echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> checksums.txt
          echo "" >> checksums.txt

          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.json" \) | sort | while read -r f; do
            HASH=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$HASH  $f" >> checksums.txt
          done

          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Sign checksums with Ed25519
        env:
          SIGNING_KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          set -e
          cd artifacts

          # Decode signing key from base64 secret
          echo "$SIGNING_KEY_B64" | base64 -d > /tmp/signing.key
          chmod 600 /tmp/signing.key

          # Sign checksums.txt
          openssl pkeyutl -sign \
            -inkey /tmp/signing.key \
            -rawin \
            -in <(sha256sum checksums.txt | cut -d' ' -f1 | xxd -r -p) \
            -out checksums.txt.sig

          # Hex-encode signature for easy embedding
          xxd -p -c 128 checksums.txt.sig > checksums.txt.sig.hex

          # Sign each package-manifest JSON
          for manifest in $(find . -name "package-manifest-*.json"); do
            openssl pkeyutl -sign \
              -inkey /tmp/signing.key \
              -rawin \
              -in <(sha256sum "$manifest" | cut -d' ' -f1 | xxd -r -p) \
              -out "${manifest}.sig"
            echo "Signed: $manifest"
          done

          # Cleanup
          rm -f /tmp/signing.key

          echo "=== Signatures generated ==="
          ls -la *.sig *.hex 2>/dev/null || true
          find . -name "*.sig" -ls

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checksums-signed
          path: |
            artifacts/checksums.txt
            artifacts/checksums.txt.sig
            artifacts/checksums.txt.sig.hex
            artifacts/**/*.sig
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Client ${{ github.ref_name }}"
          body: |
            ## OTClient ${{ github.ref_name }}



            **Checksums:** See `checksums.txt` for SHA-256 verification.
            **Signatures:** Ed25519 signatures attached (`.sig` files).
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.json
            artifacts/checksums.txt
            artifacts/checksums.txt.sig
            artifacts/checksums.txt.sig.hex
            artifacts/**/*.sig
