---
name: Build - WASM (OTC Client Web)

on:
  workflow_dispatch: # Build WASM wymaga overlay-ports i Emscripten — tylko reczne uruchomienie

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'
  # Use a recent vcpkg commit — the old builtin-baseline lacks utf8-range (protobuf dep).
  VCPKG_TOOL_COMMIT: cf6692675e04c036e21f26d64ae5fa3c8485f224
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_BUILD_TYPE: release
  VCPKG_DEFAULT_TRIPLET: wasm32-emscripten
  VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/browser/overlay-ports
  # NOTE: Do NOT set VCPKG_C_FLAGS / VCPKG_CXX_FLAGS here — they apply to ALL
  # triplets (including x64-linux host) and GCC does not understand -matomics.
  # Emscripten-specific flags are set in browser/triplets/wasm32-emscripten.cmake.

jobs:
  build-wasm:
    name: OTC WASM Build (Emscripten)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Install Linux Dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache pkg-config ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: |
          emcc --version
          em++ --version
          echo "EMSDK=$EMSDK"

      - name: CCache (sccache)
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: sccache-otc-wasm
          restore-keys: |
            sccache-otc-wasm

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-otc-wasm32-emscripten-${{ hashFiles('Tibia/silnik/canary_test/testyy/vcpkg.json', 'Tibia/silnik/canary_test/testyy/browser/overlay-ports/**', 'Tibia/silnik/canary_test/testyy/browser/triplets/**') }}
          restore-keys: |
            vcpkg-otc-wasm32-emscripten-

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_TOOL_COMMIT }}

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Configure CMake (Emscripten)
        run: |
          mkdir -p build
          emcmake cmake -G "Ninja" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
                -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
                -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/Tibia/silnik/canary_test/testyy/browser/triplets" \
                -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/Tibia/silnik/canary_test/testyy/browser/overlay-ports" \
                -DSPEED_UP_BUILD_UNITY=OFF \
                -DTOGGLE_BIN_FOLDER=ON \
                -S . -B build

      - name: Build
        run: |
          cmake --build build --config Release --parallel 4

      - name: Create and Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-wasm-${{ github.sha }}
          path: |
            ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/build/bin/
            ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/build/*.html
            ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/build/*.js
            ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/build/*.wasm
            ${{ github.workspace }}/Tibia/silnik/canary_test/testyy/build/*.data
          retention-days: 30
