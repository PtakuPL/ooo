name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # nazwa MUSI być dokładnie taka:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install tools for multi-language analysis
        run: |
          sudo apt-get update
          # fonttools (TTF analiza) + hb-shape (HarfBuzz CLI)
          sudo apt-get install -y fonttools libharfbuzz-bin
