name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - "**/*.md"
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Setup MSVC (VS 2022, x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Resolve vcpkg commit (builtin-baseline or fallback)
        id: vcpkg-commit
        shell: bash
        run: |
          fallback=4c4abc2e8727221ede31021349386dac674309b0
          vcpkg_file="vcpkg.json"
          if [ -f "$vcpkg_file" ]; then
            commit=$(python -c "import json; print(json.load(open('$vcpkg_file')).get('builtin-baseline',''))" 2>/dev/null || echo "")
          else
            commit=""
          fi
          if [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "vcpkgGitCommitId=$commit" >> "$GITHUB_OUTPUT"
            echo "Using builtin-baseline $commit"
          else
            echo "vcpkgGitCommitId=$fallback" >> "$GITHUB_OUTPUT"
            echo "Using fallback commit $fallback"
          fi

      - name: Setup vcpkg (manifest install)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-commit.outputs.vcpkgGitCommitId }}
          runVcpkgInstall: true
          vcpkgJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg.json
          vcpkgConfigurationJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg-configuration.json
          vcpkgJsonIgnores: "['**/vcpkg/**','**/browser/overlay-ports/**']"
          doNotCache: false

      - name: Configure (CMake + vcpkg toolchain, VS generator)
        shell: pwsh
        run: |
          # Note: CMAKE_BUILD_TYPE is not used with multi-config generators like Visual Studio
          # The build configuration is set via --config during the build step instead
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_number }}
          path: |
            Tibia/silnik/canary_test/testyy/build/**/Release/*.exe
            Tibia/silnik/canary_test/testyy/build/**/*.dll
            Tibia/silnik/canary_test/testyy/build/*.pdb
          if-no-files-found: warn

      - name: Upload CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-windows
          path: |
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeOutput.log
            Tibia/silnik/canary_test/testyy/build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
