name: build-linux

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Remove nested git directories (upstream mirrors)
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache pkg-config \
            libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libglu1-mesa-dev libgl1-mesa-dev libx11-dev libxext-dev \
            libopenal-dev libvorbis-dev liblzma-dev libbz2-dev \
            libssl-dev libpng-dev

      - name: Resolve vcpkg commit (builtin-baseline or fallback)
        id: vcpkg-commit
        shell: bash
        working-directory: Tibia/silnik/canary_test/testyy
        run: |
          fallback=4c4abc2e8727221ede31021349386dac674309b0
          if [ -f vcpkg.json ]; then
            commit=$(python3 -c "import json; print(json.load(open('vcpkg.json')).get('builtin-baseline',''))")
          else
            commit=""
          fi
          if [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "vcpkgGitCommitId=$commit" >> "$GITHUB_OUTPUT"
            echo "Using builtin-baseline $commit"
          else
            echo "vcpkgGitCommitId=$fallback" >> "$GITHUB_OUTPUT"
            echo "Using fallback commit $fallback"
          fi

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Setup vcpkg (manifest install)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: https://github.com/microsoft/vcpkg.git
          vcpkgGitCommitId: ${{ steps.vcpkg-commit.outputs.vcpkgGitCommitId }}
          runVcpkgInstall: true
          vcpkgJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg.json
          vcpkgConfigurationJsonGlob: Tibia/silnik/canary_test/testyy/vcpkg-configuration.json
          doNotCache: false

      - name: Configure (CMake + Ninja)
        run: |
          cmake -S . -B build/linux-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=$VCPKG_DEFAULT_TRIPLET \
            -DOTC_ENABLE_TTF=ON -DOTC_ENABLE_HARFBUZZ=ON -DOTC_ENABLE_FRIBIDI=ON \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build (Release)
        run: cmake --build build/linux-release --parallel

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otclient-linux-x64
          path: |
            Tibia/silnik/canary_test/testyy/build/linux-release/otclient
            Tibia/silnik/canary_test/testyy/build/linux-release/otclient*
          if-no-files-found: warn

      - name: Upload CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs-linux
          path: |
            Tibia/silnik/canary_test/testyy/build/linux-release/CMakeFiles/CMakeOutput.log
            Tibia/silnik/canary_test/testyy/build/linux-release/CMakeFiles/CMakeError.log
          if-no-files-found: warn
