name: Build - Android

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Tibia/silnik/canary_test/testyy/src/**'
      - 'Tibia/silnik/canary_test/testyy/android/**'
  push:
    paths:
      - 'Tibia/silnik/canary_test/testyy/src/**'
      - 'Tibia/silnik/canary_test/testyy/android/**'
    branches:
      - master

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

  android:
    name: android-apk
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure 7zip
        run: choco install -y 7zip

      - name: Download Android build bundle
        shell: powershell
        run: |
          $files = @(
            @{ Name = 'jdk.zip'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/jdk8u302-b08.zip' },
            @{ Name = 'ndk.zip'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/android-ndk-r23c-windows.zip' },
            @{ Name = 'ant.zip'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/apache-ant-1.9.7-bin.zip' },
            @{ Name = 'android_libs.7z'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/android-libs.7z' },
            @{ Name = 'build-tools.zip'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/build-tools_r30-windows.zip' },
            @{ Name = 'create_android_assets.ps1'; Url = 'https://github.com/opentibiabr/otcv8/releases/download/binary-files/create_android_assets.ps1' }
          )
          foreach ($f in $files) { Invoke-WebRequest -Uri $f.Url -OutFile $f.Name }

      - name: Extract bundles
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\Android\android-sdk | Out-Null
          7z x jdk.zip -aoa -oC:\Android\android-sdk
          7z x ndk.zip -aoa -oC:\Android\android-sdk
          7z x ant.zip -aoa -oC:\Android\android-sdk
          7z x android_libs.7z -aoa -oC:\Android
          7z x build-tools.zip -aoa -oC:\Android\android-sdk

      - name: Install CMake via sdkmanager
        shell: powershell
        run: |
          # Use full path to sdkmanager from ANDROID_HOME
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdkmanager) {
            echo "y" | & $sdkmanager --install "cmake;3.22.1"
          } else {
            # Fallback - CMake may already be available via GitHub runner
            Write-Host "sdkmanager not found, checking if CMake is preinstalled..."
            cmake --version
          }

      - name: Prepare assets (data.zip)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\create_android_assets.ps1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK with Gradle
        shell: bash
        working-directory: Tibia/silnik/canary_test/testyy/android
        env:
          ANDROID_NDK_HOME: C:\Android\android-sdk\android-ndk-r23c
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: find-apk
        shell: bash
        working-directory: Tibia/silnik/canary_test/testyy/android
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-android-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: warn
