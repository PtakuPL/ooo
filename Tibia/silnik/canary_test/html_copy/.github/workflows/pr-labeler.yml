---
name: 'PR - Labeler (disabled)'
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Workflow disabled; manual dispatch only.'
        required: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@main
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
