# Build Launcher – cross-platform release candidates
# LR-065: Manual dispatch + pre-release tag trigger
# Spec: launcher+rust.md §6.2

name: Build Launcher

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [feature/ticket-gate]
    paths:
      - 'Tibia/silnik/launcher-rust/**'
      - '.github/workflows/build-launcher.yml'
    tags:
      - 'v*-rc*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────
  # 1. Build Rust core (CLI + library crates)
  # ─────────────────────────────────────────────────
  build-core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Tibia/silnik/launcher-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tibia/silnik/launcher-rust/target
          key: build-${{ runner.os }}-cargo-${{ hashFiles('Tibia/silnik/launcher-rust/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-cargo-

      - name: Determine profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "flag=${{ github.event.inputs.profile == 'debug' && '' || '--release' }}" >> "$GITHUB_OUTPUT"
            echo "dir=${{ github.event.inputs.profile == 'debug' && 'debug' || 'release' }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--release" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all crates
        run: cargo build --all ${{ steps.profile.outputs.flag }} --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all ${{ steps.profile.outputs.flag }} --target ${{ matrix.target }}

      - name: Collect CLI binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/${{ steps.profile.outputs.dir }}/launcher-cli ../artifacts/launcher-cli-${{ matrix.artifact_suffix }}

      - name: Collect CLI binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/${{ steps.profile.outputs.dir }}/launcher-cli.exe ../artifacts/launcher-cli-${{ matrix.artifact_suffix }}.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-cli-${{ matrix.artifact_suffix }}
          path: Tibia/silnik/artifacts/launcher-cli*
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 2. Build Tauri app (LR-031)
  # ─────────────────────────────────────────────────
  build-tauri:
    name: Tauri (${{ matrix.os }})
    needs: [build-core]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Tibia/silnik/launcher-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tibia/silnik/launcher-rust/target
          key: build-tauri-${{ runner.os }}-cargo-${{ hashFiles('Tibia/silnik/launcher-rust/Cargo.lock') }}

      - name: Build Tauri binary
        working-directory: Tibia/silnik/launcher-rust
        run: cargo build --release --package launcher-tauri --target ${{ matrix.target }}

      - name: Collect Tauri binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/release/launcher-tauri ../artifacts/launcher-tauri-${{ matrix.artifact_suffix }}

      - name: Collect Tauri binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/release/launcher-tauri.exe ../artifacts/launcher-tauri-${{ matrix.artifact_suffix }}.exe

      - name: Upload Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-tauri-${{ matrix.artifact_suffix }}
          path: Tibia/silnik/artifacts/launcher-tauri*
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 3. Build helper updater (LR-047)
  # ─────────────────────────────────────────────────
  build-helper:
    name: Helper (${{ matrix.os }})
    needs: [build-core]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Tibia/silnik/launcher-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tibia/silnik/launcher-rust/target
          key: build-helper-${{ runner.os }}-cargo-${{ hashFiles('Tibia/silnik/launcher-rust/Cargo.lock') }}

      - name: Build helper
        run: cargo build --release --package launcher-helper --target ${{ matrix.target }}

      - name: Collect helper binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/release/launcher-helper ../artifacts/launcher-helper-${{ matrix.artifact_suffix }}

      - name: Collect helper binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/release/launcher-helper.exe ../artifacts/launcher-helper-${{ matrix.artifact_suffix }}.exe

      - name: Upload helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-helper-${{ matrix.artifact_suffix }}
          path: Tibia/silnik/artifacts/launcher-helper*
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4. Generate SHA-256 checksums & summary
  # ─────────────────────────────────────────────────
  checksums:
    name: SHA-256 Checksums
    needs: [build-core, build-tauri, build-helper]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate checksums
        run: |
          cd all-artifacts
          find . -type f \( -name 'launcher-*' \) -exec sha256sum {} + | sort > ../checksums.txt
          cat ../checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## Build Launcher Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            echo "| \`$file\` | \`${hash:0:16}…\` |" >> "$GITHUB_STEP_SUMMARY"
          done < checksums.txt
