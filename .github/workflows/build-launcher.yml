# Build Launcher – Linux + Windows
# Unified: jeden job buduje CLI + Tauri + Helper na każdej platformie

name: Build Launcher

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (release / debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [feature/ticket-gate]
    paths:
      - 'Tibia/silnik/launcher-rust/**'
      - '.github/workflows/build-launcher.yml'
    tags:
      - 'v*-rc*'

defaults:
  run:
    working-directory: Tibia/silnik/launcher-rust

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tibia/silnik/launcher-rust/target
          key: build-${{ runner.os }}-cargo-${{ hashFiles('Tibia/silnik/launcher-rust/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-cargo-

      - name: Determine profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "flag=${{ github.event.inputs.profile == 'debug' && '' || '--release' }}" >> "$GITHUB_OUTPUT"
            echo "dir=${{ github.event.inputs.profile == 'debug' && 'debug' || 'release' }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--release" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify frontend files exist
        shell: bash
        run: |
          echo "--- Checking apps/launcher-tauri/ui/ ---"
          ls -la apps/launcher-tauri/ui/
          test -f apps/launcher-tauri/ui/index.html || { echo "ERROR: index.html missing!"; exit 1; }

      - name: Clean launcher-tauri cache (force re-embed frontend)
        shell: bash
        run: cargo clean -p launcher-tauri ${{ steps.profile.outputs.flag }} --target ${{ matrix.target }} 2>/dev/null || true

      - name: Build all crates
        run: cargo build --all ${{ steps.profile.outputs.flag }} --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all ${{ steps.profile.outputs.flag }} --target ${{ matrix.target }}

      - name: Collect binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          DIR="${{ steps.profile.outputs.dir }}"
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/$DIR/launcher-cli    ../artifacts/launcher-cli-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/$DIR/launcher-tauri  ../artifacts/launcher-tauri-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/$DIR/launcher-helper ../artifacts/launcher-helper-${{ matrix.suffix }}
          chmod +x ../artifacts/launcher-*

      - name: Collect binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DIR="${{ steps.profile.outputs.dir }}"
          mkdir -p ../artifacts
          cp target/${{ matrix.target }}/$DIR/launcher-cli.exe    ../artifacts/launcher-cli-${{ matrix.suffix }}.exe
          cp target/${{ matrix.target }}/$DIR/launcher-tauri.exe  ../artifacts/launcher-tauri-${{ matrix.suffix }}.exe
          cp target/${{ matrix.target }}/$DIR/launcher-helper.exe ../artifacts/launcher-helper-${{ matrix.suffix }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.suffix }}
          path: Tibia/silnik/artifacts/launcher-*
          if-no-files-found: error

  checksums:
    name: SHA-256 Checksums
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate checksums
        run: |
          cd all-artifacts
          find . -type f \( -name 'launcher-*' \) -exec sha256sum {} + | sort > ../checksums.txt
          cat ../checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## Build Launcher Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            echo "| \`$file\` | \`${hash:0:16}…\` |" >> "$GITHUB_STEP_SUMMARY"
          done < checksums.txt
