name: Build - Android

on:
  push:
    branches:
      - master
      - feature/i18n-multilanguage
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'android/**'
      - 'cmake/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches:
      - master
      - feature/i18n-multilanguage
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'android/**'
      - 'cmake/**'
      - '.github/workflows/build-android.yml'

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            vcpkg_triplet: arm64-android
          - abi: armeabi-v7a
            vcpkg_triplet: arm-neon-android
          # x86/x86_64 can be enabled for emulator testing
          # - abi: x86_64
          #   vcpkg_triplet: x64-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android NDK
        run: |
          # NDK r27 stable — matching build.gradle ndkVersion
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '5b1214315250939257ef5d62ecdcbca18cf4fb1c'

      - name: Cache vcpkg packages (${{ matrix.vcpkg_triplet }})
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
          key: vcpkg-android-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-android-${{ matrix.vcpkg_triplet }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/feature/i18n-multilanguage' }}

      - name: Build APK (${{ matrix.abi }})
        working-directory: android
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          # Override abiFilters to build only the target ABI
          ./gradlew assembleRelease \
            -Pabi=${{ matrix.abi }} \
            -PndkPath=$ANDROID_NDK_HOME \
            --no-daemon \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: otclient-native-${{ matrix.abi }}
          path: android/app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/${{ matrix.abi }}/
          if-no-files-found: warn
