name: Analysis - SonarCloud

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

env:
  VCPKG_BUILD_TYPE: release
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.head.ref }}
          repository: ${{ github.event_name == 'push' && github.repository || github.event.pull_request.head.repo.full_name }}

      - name: Remove nested git directories (upstream mirrors)
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libglew-dev libx11-dev linux-headers-$(uname -r)

      - name: Switch to GCC 11
        run: |
          sudo apt install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-11 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-11
          sudo update-alternatives --set gcc /usr/bin/gcc-11

      - name: Detect CPU core count
        id: cpu-count
        run: echo "count=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: $HOME/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Tibia/silnik/canary_test/testyy/CMakeLists.txt', 'Tibia/silnik/canary_test/testyy/vcpkg.json', 'Tibia/silnik/canary_test/testyy/src/**/*.cpp', 'Tibia/silnik/canary_test/testyy/src/**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache SonarCloud analysis data
        uses: actions/cache@v4
        with:
          path: $HOME/.cfamily
          key: sonar-cfamily-${{ runner.os }}-${{ hashFiles('Tibia/silnik/canary_test/testyy/CMakeLists.txt', 'Tibia/silnik/canary_test/testyy/vcpkg.json', 'Tibia/silnik/canary_test/testyy/src/**/*.cpp', 'Tibia/silnik/canary_test/testyy/src/**/*.h') }}
          restore-keys: |
            sonar-cfamily-${{ runner.os }}-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: $HOME/.sonar/cache
          key: sonar-packages-${{ runner.os }}
          restore-keys: |
            sonar-packages-${{ runner.os }}-

      - name: Resolve vcpkg commit (builtin-baseline or fallback)
        id: vcpkg-step
        shell: bash
        run: |
          fallback=5b1214315250939257ef5d62ecdcbca18cf4fb1c
          commit=""
          if [[ -f "vcpkg.json" ]]; then
            commit=$(python3 <<'PY'
import json
try:
  with open('vcpkg.json') as f:
    data = json.load(f)
  print(data.get('builtin-baseline', ''))
except Exception:
  print('')
PY
)
          fi
          if [[ $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo "vcpkgGitCommitId=$commit" >> "$GITHUB_OUTPUT"
            echo "Using builtin-baseline $commit"
          else
            echo "vcpkgGitCommitId=$fallback" >> "$GITHUB_OUTPUT"
            echo "Using fallback commit $fallback"
          fi

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      - name: Setup vcpkg (manifest install)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}
          runVcpkgInstall: true
          vcpkgJsonGlob: 'Tibia/silnik/canary_test/testyy/vcpkg.json'
          vcpkgConfigurationJsonGlob: 'Tibia/silnik/canary_test/testyy/vcpkg-configuration.json'
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/browser/overlay-ports/**']"

      - name: vcpkg manifest validation (preflight)
        run: |
          echo "vcpkg: printing installed ports and validating manifest..."
          $VCPKG_ROOT/vcpkg search || echo "vcpkg search failed (ignored)"
          $VCPKG_ROOT/vcpkg install || (echo "vcpkg manifest install failed; please check ports in vcpkg.json"; exit 1)

      - name: Install sonar-scanner
        uses: SonarSource/sonarcloud-github-c-cpp@v1

      - name: Generate compilation database
        run: |
          mkdir -p build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DOPTIONS_ENABLE_CCACHE=ON \
                -DSPEED_UP_BUILD_UNITY=OFF \
                -S . -B build

      - name: Run PR sonar-scanner
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          sonar-scanner \
            --define sonar.cfamily.threads=${{ steps.cpu-count.outputs.count }} \
            --define sonar.cfamily.cache.enabled=true \
            --define sonar.cfamily.cache.path="$HOME/.cfamily" \
            --define sonar.cfamily.compile-commands=build/compile_commands.json \
            --define sonar.pullrequest.key=${{ github.event.pull_request.number }} \
            --define sonar.pullrequest.branch=$BRANCH \
            --define sonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

      - name: Run sonar-scanner
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            --define sonar.cfamily.threads=${{ steps.cpu-count.outputs.count }} \
            --define sonar.cfamily.cache.enabled=true \
            --define sonar.cfamily.cache.path="$HOME/.cfamily" \
            --define sonar.cfamily.compile-commands=build/compile_commands.json
