---
name: Analysis - SonarCloud (Linux)

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "Tibia/silnik/canary_test/testyy/src/**"
      - "Tibia/silnik/canary_test/testyy/CMakeLists.txt"
      - "Tibia/silnik/canary_test/testyy/vcpkg.json"
  push:
    branches: [master]
    paths:
      - "Tibia/silnik/canary_test/testyy/src/**"
      - "Tibia/silnik/canary_test/testyy/CMakeLists.txt"
      - "Tibia/silnik/canary_test/testyy/vcpkg.json"

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'
  # Use a recent vcpkg commit — the old builtin-baseline lacks utf8-range (protobuf dep).
  VCPKG_TOOL_COMMIT: cf6692675e04c036e21f26d64ae5fa3c8485f224
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_BUILD_TYPE: release
  VCPKG_DEFAULT_TRIPLET: x64-linux
  VCPKG_DEFAULT_HOST_TRIPLET: x64-linux

jobs:
  sonarcloud-linux:
    name: SonarCloud (Linux OTC)
    runs-on: ubuntu-22.04
    env:
      SONAR_TOKEN: ${{ secrets.SONARCLOUDTOKEN }}
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Install Linux Dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache software-properties-common pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev

      - name: Switch to gcc-13
        working-directory: .
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-13
          sudo update-alternatives --set gcc /usr/bin/gcc-13

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-sonar-x64-linux-${{ hashFiles('Tibia/silnik/canary_test/testyy/vcpkg.json') }}
          restore-keys: |
            vcpkg-sonar-x64-linux-

      - name: Cache SonarCloud analysis data
        uses: actions/cache@v4
        with:
          path: ~/.cfamily
          key: sonar-cfamily-Linux-${{ hashFiles('Tibia/silnik/canary_test/testyy/CMakeLists.txt','Tibia/silnik/canary_test/testyy/vcpkg.json') }}
          restore-keys: |
            sonar-cfamily-Linux-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-packages-Linux
          restore-keys: |
            sonar-packages-Linux-

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_TOOL_COMMIT }}

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Generate compilation database
        run: |
          mkdir -p build
          cmake -G "Ninja" \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                -DSPEED_UP_BUILD_UNITY=OFF \
                -DOTC_ENABLE_TTF=OFF \
                -DOTC_ENABLE_HARFBUZZ=OFF \
                -DOTC_ENABLE_FRIBIDI=OFF \
                -S . -B build

      - name: Run PR sonar-scanner
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          projectBaseDir: Tibia/silnik/canary_test/testyy
          args: >
            -Dsonar.cfamily.threads=4
            -Dsonar.cfamily.cache.enabled=true
            "-Dsonar.cfamily.cache.path=$HOME/.cfamily"
            -Dsonar.cfamily.compile-commands=Tibia/silnik/canary_test/testyy/build/compile_commands.json
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

      - name: Run sonar-scanner
        if: ${{ github.event_name == 'push' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          projectBaseDir: Tibia/silnik/canary_test/testyy
          args: >
            -Dsonar.cfamily.threads=4
            -Dsonar.cfamily.cache.enabled=true
            "-Dsonar.cfamily.cache.path=$HOME/.cfamily"
            -Dsonar.cfamily.compile-commands=Tibia/silnik/canary_test/testyy/build/compile_commands.json
