---
name: Canary - Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Tibia/silnik/canary_test/src/**"
      - "Tibia/silnik/canary_test/tests/**/*.cpp"
      - "Tibia/silnik/canary_test/CMakeLists.txt"
      - "Tibia/silnik/canary_test/CMakePresets.json"
      - "Tibia/silnik/canary_test/vcpkg.json"
      - ".github/workflows/build-canary.yml"
  merge_group:
  push:
    branches: [master, main]
    paths:
      - "Tibia/silnik/canary_test/src/**"
      - "Tibia/silnik/canary_test/tests/**/*.cpp"
      - "Tibia/silnik/canary_test/CMakeLists.txt"
      - "Tibia/silnik/canary_test/CMakePresets.json"
      - "Tibia/silnik/canary_test/vcpkg.json"
      - ".github/workflows/build-canary.yml"

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'
  VCPKG_FEATURE_FLAGS: manifests,binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_BUILD_TYPE: release

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

  build:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    name: canary-${{ matrix.os }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        buildtype: [linux-release, linux-debug]

    defaults:
      run:
        working-directory: Tibia/silnik/canary_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache software-properties-common

      - name: Switch to gcc-13 on Ubuntu 22.04
        if: matrix.os == 'ubuntu-22.04'
        working-directory: .
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-13
          sudo update-alternatives --set gcc /usr/bin/gcc-13

      - name: Switch to gcc-14 on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14 \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14

      - name: CCache (sccache)
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: sccache-canary-${{ matrix.os }}-${{ matrix.buildtype }}
          restore-keys: |
            sccache-canary-${{ matrix.os }}

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Read vcpkg baseline
        run: |
          vcpkgCommitId=$(grep 'builtin-baseline' vcpkg.json | awk -F: '{print $2}' | tr -d '," ')
          echo "vcpkg commit ID: $vcpkgCommitId"
          echo "VCPKG_GIT_COMMIT_ID=$vcpkgCommitId" >> "$GITHUB_ENV"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/Tibia/silnik/canary_test/vcpkg/installed
            ${{ github.workspace }}/Tibia/silnik/canary_test/vcpkg/buildtrees
            ${{ github.workspace }}/Tibia/silnik/canary_test/vcpkg/downloads
          key: vcpkg-canary-${{ matrix.os }}-${{ hashFiles('Tibia/silnik/canary_test/vcpkg.json') }}
          restore-keys: |
            vcpkg-canary-${{ matrix.os }}-

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}
          vcpkgDirectory: ${{ github.workspace }}/Tibia/silnik/canary_test/vcpkg

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.27.0'

      - name: Configure + Build (CMake Presets)
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/Tibia/silnik/canary_test/CMakeLists.txt
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON']"
          configurePreset: ${{ matrix.buildtype }}
          buildPreset: ${{ matrix.buildtype }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ matrix.os }}-${{ matrix.buildtype }}-${{ github.sha }}
          path: |
            ${{ github.workspace }}/Tibia/silnik/canary_test/build/${{ matrix.buildtype }}/bin/
          retention-days: 30

      - name: Unit tests
        continue-on-error: true
        run: |
          cd build/${{ matrix.buildtype }}
          if ctest -N -R unit | grep -q "Test #"; then ctest -V -R unit --output-on-failure; else echo "No unit tests."; fi

      - name: Integration tests
        continue-on-error: true
        run: |
          cd build/${{ matrix.buildtype }}
          if ctest -N -R integration | grep -q "Test #"; then ctest -V -R integration --output-on-failure; else echo "No integration tests."; fi
