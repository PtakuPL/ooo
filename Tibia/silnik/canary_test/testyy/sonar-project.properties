sonar.projectKey=PtakuPL_ooo
sonar.organization=ptakupl
sonar.projectName=Issue30-MultiPlatform
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.cfamily.cpp20=true

# Agregujemy dwie części projektu (serwer + klient), żeby wszystkie workflow
# SonarCloud bazowały na jednym zestawie ustawień.
sonar.modules=server,client
sonar.exclusions=**/*.html,**/*.css,**/*.otui,**/*.otml

# --- Klient (OTClient / testyy) ---
client.sonar.projectName=OTClient testyy
client.sonar.projectBaseDir=.
client.sonar.sources=src,modules,data
client.sonar.exclusions=**/*.lua,**/*.png,**/*.jpg,**/*.ttf,**/*.otui,**/*.otml,**/*.json,**/*.md
client.sonar.sourceEncoding=UTF-8

# --- Serwer (canary_test) ---
server.sonar.projectName=Canary Server
server.sonar.projectBaseDir=..
server.sonar.sources=src,data,scripts
server.sonar.exclusions=**/*.lua,**/*.sql,**/*.md,**/*.json,**/*.xml
server.sonar.sourceEncoding=UTF-8
