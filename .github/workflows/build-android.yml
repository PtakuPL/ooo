name: Build - Android

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Tibia/silnik/canary_test/testyy/src/**'
      - 'Tibia/silnik/canary_test/testyy/android/**'
  push:
    paths:
      - 'Tibia/silnik/canary_test/testyy/src/**'
      - 'Tibia/silnik/canary_test/testyy/android/**'
    branches:
      - master

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  MAKEFLAGS: '-j 4'

jobs:
  cancel-runs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

  android:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Tibia/silnik/canary_test/testyy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Remove nested git directories (upstream mirrors)
        shell: bash
        run: |
          rm -rf oryginall/canary-serwer/.git || true
          rm -rf oryginall/otclient/.git || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK with Gradle
        working-directory: Tibia/silnik/canary_test/testyy/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: find-apk
        working-directory: Tibia/silnik/canary_test/testyy/android
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-android-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: warn
