name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install base tools for Copilot agent
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ripgrep fd-find jq tree sqlite3

      - name: Install C++ analysis tools (clang-tidy, cppcheck)
        run: |
          sudo apt-get install -y \
            clang-tidy \
            cppcheck

      - name: Install fonts & HarfBuzz tools (for multilingual analysis)
        run: |
          sudo apt-get install -y \
            fonttools \
            libharfbuzz-bin
